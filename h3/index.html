<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>光幕 LUMEN · 正在进入</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(800px 460px at 20% 10%,rgba(217,179,106,.12),transparent 60%),
      radial-gradient(700px 460px at 82% 20%,rgba(103,232,249,.08),transparent 62%),#06070b;
    color:#f8fafc;font-family:"Inter","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
  .box{max-width:420px;text-align:center}
  .logo{font-size:15px;letter-spacing:.3em;color:#d9b36a;margin-bottom:18px}
  h1{font-size:22px;font-weight:800;letter-spacing:.04em;margin-bottom:12px}
  p{font-size:13px;line-height:1.8;color:#8b94a3}
  a.btn{display:inline-block;margin-top:22px;padding:12px 22px;border-radius:12px;
    background:linear-gradient(180deg,#f0d9a4,#d9b36a);color:#1b1608;text-decoration:none;
    font-weight:700;font-size:14px}
  .hint{margin-top:16px;font-size:11.5px;color:#5f6875;line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">光幕 LUMEN ATELIER</div>
    <h1>正在进入工作台…</h1>
    <p id="tip">如果 3 秒内没有自动跳转，点下面的按钮。</p>
    <a class="btn" id="go" href="#">进入工作台</a>
    <div class="hint">登录仅限指定手机号 · 其他号码可以打开页面，但无法注册</div>
  </div>
  <script>
    var baked = "https://closely-relax-sea-thomson.trycloudflare.com";
    var resolved = false;
    function go(u) { if (resolved || !u) return; resolved = true; try { location.replace(u); } catch (e) {} }
    function ping(u) {
      return new Promise(function (resolve) {
        if (!u) return resolve(false);
        var done = false;
        var t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 2200);
        fetch(u + '/api/ping', { mode: 'no-cors', cache: 'no-store' })
          .then(function () { if (!done) { done = true; clearTimeout(t); resolve(true); } })
          .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
      });
    }
    var candidates = [baked];
    document.getElementById('go').href = baked;
    // 从 GitHub 取最新地址；CDN 可能缓存旧地址，所以拿到后还要实际测一下通不通
    fetch('https://raw.githubusercontent.com/cmz189/my-website/gh-pages/h3/target.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (txt) {
        var u = String(txt || '').trim();
        if (u.indexOf('https://') === 0 && u.indexOf('.trycloudflare.com') > -1 && candidates.indexOf(u) < 0) candidates.unshift(u);
      })
      .catch(function () {});
    (async function () {
      for (var round = 0; round < 12 && !resolved; round++) {
        for (var i = 0; i < candidates.length && !resolved; i++) {
          if (await ping(candidates[i])) { go(candidates[i]); return; }
        }
        if (!resolved) document.getElementById('tip').textContent = '正在恢复连接…（' + (round + 1) + '/12）';
        await new Promise(function (r) { setTimeout(r, 1800); });
      }
      if (!resolved) {
        document.getElementById('go').textContent = '手动进入';
        document.getElementById('tip').textContent = '自动进入失败：电脑可能刚开机或隧道正在恢复，点按钮重试或稍后刷新。';
      }
    })();
  </script>
  <noscript><a href="https://closely-relax-sea-thomson.trycloudflare.com">进入工作台</a></noscript>
</body>
</html>
<!-- target: https://closely-relax-sea-thomson.trycloudflare.com -->
